<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت سایت - گزارش‌نویسی گروهی</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .button-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; }
        .error { color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #e74c3c; }
        .success { color: #27ae60; background: #e8f8f0; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #27ae60; }
        .info { color: #2980b9; background: #e8f4f8; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #2980b9; }
        .hidden { display: none; }
        .table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14px; }
        .table th { background: #3498db; color: #fff; padding: 10px; text-align: right; }
        .table td { padding: 10px; border-bottom: 1px solid #ddd; }
        .table-responsive { overflow-x: auto; }
        @media (max-width: 768px) {
            .btn { width: 100%; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مدیریت سایت</h1>
        <!-- ============================================ -->
        <!-- بخش: ورود رمز مدیریت -->
        <!-- ============================================ -->
        <div id="loginSection">
            <h2>ورود به بخش مدیریت</h2>
            <div class="form-group">
                <label for="managerPass">رمز مدیریت:</label>
                <input type="password" id="managerPass" class="form-control" placeholder="رمز را وارد کنید">
            </div>
            <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="rememberManager" checked>
                <label for="rememberManager" style="margin:0;font-weight:normal;">مرا به خاطر بسپار</label>
            </div>
            <button id="loginBtn" class="btn btn-primary">ورود</button>
            <div id="loginError" class="error hidden">رمز اشتباه است. مجدداً تلاش کنید.</div>
            <div id="loginMessage" style="margin-top:10px;"></div>
        </div>

        <!-- ============================================ -->
        <!-- بخش: پنل مدیریت (پس از ورود) -->
        <!-- ============================================ -->
        <div id="managerPanel" class="hidden">
            <h2>پنل مدیریت سایت</h2>
            <div class="button-group">
                <button id="showRequestsBtn" class="btn btn-primary">مدیریت درخواست‌های جدید</button>
                <button id="showSystemsBtn" class="btn btn-primary">ویرایش سیستم‌ها</button>
                <button id="logoutBtn" class="btn btn-danger">خروج</button>
            </div>
            <!-- ============================================ -->
            <!-- بخش: مدیریت درخواست‌های جدید -->
            <!-- ============================================ -->
            <div id="requestsSection" class="hidden">
                <h3>درخواست‌های جدید</h3>
                <div id="requestsList"></div>
            </div>
            <!-- ============================================ -->
            <!-- بخش: ویرایش سیستم‌ها -->
            <!-- ============================================ -->
            <div id="systemsSection" class="hidden">
                <h3>لیست سیستم‌ها</h3>
                <div id="systemsList"></div>
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // تابع: loadSavedManagerInfo
    // ============================================
    function loadSavedManagerInfo() {
        var saved = localStorage.getItem('manager_remember');
        if (saved === 'true') {
            document.getElementById('managerPass').focus();
        }
    }

    // ============================================
    // تابع: checkManagerLogin
    // ============================================
    function checkManagerLogin() {
        var password = document.getElementById('managerPass').value;
        var rememberMe = document.getElementById('rememberManager').checked;
        var errorDiv = document.getElementById('loginError');
        var messageDiv = document.getElementById('loginMessage');

        if (!password) {
            errorDiv.classList.remove('hidden');
            errorDiv.textContent = 'لطفاً رمز را وارد کنید';
            return;
        }

        errorDiv.classList.add('hidden');
        if (messageDiv) messageDiv.innerHTML = '⏳ در حال بررسی...';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (messageDiv) messageDiv.innerHTML = '';
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            if (rememberMe) {
                                localStorage.setItem('manager_remember', 'true');
                            } else {
                                localStorage.removeItem('manager_remember');
                            }
                            document.getElementById('loginSection').style.display = 'none';
                            document.getElementById('managerPanel').classList.remove('hidden');
                            errorDiv.classList.add('hidden');
                        } else {
                            errorDiv.classList.remove('hidden');
                            errorDiv.textContent = '❌ رمز اشتباه است. مجدداً تلاش کنید.';
                            document.getElementById('managerPass').value = '';
                            document.getElementById('managerPass').focus();
                        }
                    } catch(e) {
                        errorDiv.classList.remove('hidden');
                        errorDiv.textContent = '❌ خطا در پردازش پاسخ سرور';
                    }
                } else {
                    errorDiv.classList.remove('hidden');
                    errorDiv.textContent = '❌ خطا در ارتباط با سرور (کد: ' + xhr.status + ')';
                }
            }
        };
        xhr.send('action=verify_manager&password=' + encodeURIComponent(password));
    }

    // ============================================
    // تابع: loadRequests
    // ============================================
    function loadRequests() {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    displayRequests(response.data);
                }
            }
        };
        xhr.send('action=get_requests');
    }

    // ============================================
    // تابع: displayRequests
    // ============================================
    function displayRequests(requests) {
        var container = document.getElementById('requestsList');
        if (!requests || requests.length === 0) {
            container.innerHTML = '<p class="info">هیچ درخواست جدیدی وجود ندارد.</p>';
            return;
        }

        var html = '<div class="table-responsive"><table class="table"><thead><tr><th>#</th><th>نام سیستم</th><th>تماس</th><th>تاریخ درخواست</th><th>عملیات</th></tr></thead><tbody>';
        requests.forEach(function(req) {
            html += '<tr><td>' + req.id + '</td><td>' + req.system_name + '</td><td>' + req.contact + '</td><td>' + req.request_date + '</td>';
            html += '<td><button onclick="approveRequest(' + req.id + ')" class="btn btn-success btn-sm">قبول</button> ';
            html += '<button onclick="rejectRequest(' + req.id + ')" class="btn btn-danger btn-sm">رد</button></td></tr>';
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    // ============================================
    // تابع: approveRequest
    // ============================================
    function approveRequest(requestId) {
        if (!confirm('آیا از تایید این درخواست مطمئن هستید؟')) return;
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('✅ درخواست تایید شد.\nنام سیستم: ' + response.data.system_name + '\nرمز رییس: ' + response.data.boss_username);
                    loadRequests();
                } else {
                    alert('❌ خطا در تایید درخواست');
                }
            }
        };
        xhr.send('action=approve_request&request_id=' + requestId);
    }

    // ============================================
    // تابع: rejectRequest
    // ============================================
    function rejectRequest(requestId) {
        if (!confirm('آیا از رد این درخواست مطمئن هستید؟')) return;
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('✅ درخواست رد شد');
                    loadRequests();
                } else {
                    alert('❌ خطا در رد درخواست');
                }
            }
        };
        xhr.send('action=reject_request&request_id=' + requestId);
    }

    // ============================================
    // تابع: loadSystems
    // ============================================
    function loadSystems() {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    displaySystems(response.data);
                }
            }
        };
        xhr.send('action=get_bosses');
    }

    // ============================================
    // تابع: displaySystems
    // ============================================
    function displaySystems(systems) {
        var container = document.getElementById('systemsList');
        if (!systems || systems.length === 0) {
            container.innerHTML = '<p class="info">هیچ سیستمی ثبت نشده است.</p>';
            return;
        }

        var html = '<div class="table-responsive"><table class="table"><thead><tr><th>#</th><th>نام سیستم</th><th>رمز رییس</th><th>تماس</th><th>عملیات</th></tr></thead><tbody>';
        systems.forEach(function(sys) {
            html += '<tr><td>' + sys.id + '</td><td>' + sys.system_name + '</td>';
            html += '<td><input type="text" id="bossPass_' + sys.id + '" value="' + sys.boss_username + '" class="form-control" style="width:200px;display:inline-block;"></td>';
            html += '<td>' + (sys.contact || '-') + '</td>';
            html += '<td><button onclick="updateBoss(' + sys.id + ')" class="btn btn-primary btn-sm">به‌روزرسانی</button></td></tr>';
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    // ============================================
    // تابع: updateBoss
    // ============================================
    function updateBoss(bossId) {
        var newPass = document.getElementById('bossPass_' + bossId).value.trim();
        if (!newPass || newPass.length < 8) {
            alert('رمز باید حداقل 8 کاراکتر باشد');
            return;
        }
        if (!confirm('آیا از تغییر رمز مطمئن هستید؟')) return;

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('✅ رمز با موفقیت به‌روزرسانی شد');
                    loadSystems();
                } else {
                    alert('❌ خطا در به‌روزرسانی رمز');
                }
            }
        };
        xhr.send('action=update_boss&boss_id=' + bossId + '&new_username=' + encodeURIComponent(newPass));
    }

    // ============================================
    // تابع: logout
    // ============================================
    function logout() {
        if (confirm('آیا می‌خواهید اطلاعات ورود شما پاک شود؟')) {
            localStorage.removeItem('manager_remember');
        }
        location.reload();
    }

    // ============================================
    // رویدادها
    // ============================================
    document.getElementById('loginBtn').addEventListener('click', checkManagerLogin);
    document.getElementById('managerPass').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkManagerLogin();
    });

    document.getElementById('showRequestsBtn').addEventListener('click', function() {
        document.getElementById('requestsSection').classList.remove('hidden');
        document.getElementById('systemsSection').classList.add('hidden');
        loadRequests();
    });

    document.getElementById('showSystemsBtn').addEventListener('click', function() {
        document.getElementById('requestsSection').classList.add('hidden');
        document.getElementById('systemsSection').classList.remove('hidden');
        loadSystems();
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    document.addEventListener('DOMContentLoaded', loadSavedManagerInfo);
    </script>
</body>
</html>
