<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت سایت - گزارش‌نویسی گروهی</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <!-- ============================================ -->
        <!-- بخش: ورود رمز مدیریت -->
        <!-- ============================================ -->
        <div id="loginSection">
            <h2>ورود به بخش مدیریت</h2>
            <div class="form-group">
                <label for="managerPass">رمز مدیریت:</label>
                <input type="password" id="managerPass" class="form-control">
                <button id="loginBtn" class="btn btn-primary">ورود</button>
            </div>
            <div id="loginError" class="error" style="display:none;">رمز اشتباه است. مجدداً تلاش کنید.</div>
        </div>

        <!-- ============================================ -->
        <!-- بخش: پنل مدیریت (پس از ورود) -->
        <!-- ============================================ -->
        <div id="managerPanel" style="display:none;">
            <h2>پنل مدیریت سایت</h2>
            <div class="button-group">
                <button id="showRequestsBtn" class="btn btn-primary">مدیریت درخواست‌های جدید</button>
                <button id="showSystemsBtn" class="btn btn-primary">ویرایش سیستم‌ها</button>
                <button id="logoutBtn" class="btn btn-danger">خروج</button>
            </div>

            <!-- ============================================ -->
            <!-- بخش: مدیریت درخواست‌های جدید -->
            <!-- ============================================ -->
            <div id="requestsSection" style="display:none;">
                <h3>درخواست‌های جدید</h3>
                <div id="requestsList"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: ویرایش سیستم‌ها -->
            <!-- ============================================ -->
            <div id="systemsSection" style="display:none;">
                <h3>لیست سیستم‌ها</h3>
                <div id="systemsList"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/functions.js"></script>
    <script>
        // ============================================
        // تابع: checkManagerLogin
        // وظیفه: بررسی ورود مدیر
        // ورودی: ندارد
        // خروجی: ندارد
        // ============================================
        function checkManagerLogin() {
            var password = document.getElementById('managerPass').value;
            if (!password) {
                alert('لطفاً رمز را وارد کنید');
                return;
            }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('managerPanel').style.display = 'block';
                        document.getElementById('loginError').style.display = 'none';
                    } else {
                        document.getElementById('loginError').style.display = 'block';
                        document.getElementById('managerPass').value = '';
                        document.getElementById('managerPass').focus();
                    }
                }
            };
            xhr.send('action=verify_manager&password=' + encodeURIComponent(password));
        }

        // ============================================
        // تابع: loadRequests
        // وظیفه: بارگذاری درخواست‌های جدید
        // ورودی: ندارد
        // خروجی: ندارد
        // ============================================
        function loadRequests() {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        displayRequests(response.data);
                    }
                }
            };
            xhr.send('action=get_requests');
        }

        // ============================================
        // تابع: displayRequests
        // وظیفه: نمایش درخواست‌ها در جدول
        // ورودی: requests (لیست درخواست‌ها)
        // خروجی: ندارد
        // ============================================
        function displayRequests(requests) {
            var container = document.getElementById('requestsList');
            if (!requests || requests.length === 0) {
                container.innerHTML = '<p class="info">هیچ درخواست جدیدی وجود ندارد.</p>';
                return;
            }

            var html = '<table class="table">';
            html += '<thead><tr><th>#</th><th>نام سیستم</th><th>تماس</th><th>تاریخ درخواست</th><th>عملیات</th></tr></thead>';
            html += '<tbody>';
            requests.forEach(function(req) {
                html += '<tr>';
                html += '<td>' + req.id + '</td>';
                html += '<td>' + req.system_name + '</td>';
                html += '<td>' + req.contact + '</td>';
                html += '<td>' + req.request_date + '</td>';
                html += '<td>';
                html += '<button onclick="approveRequest(' + req.id + ')" class="btn btn-success btn-sm">قبول</button> ';
                html += '<button onclick="rejectRequest(' + req.id + ')" class="btn btn-danger btn-sm">رد</button>';
                html += '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // تابع: approveRequest
        // وظیفه: تایید درخواست
        // ورودی: requestId
        // خروجی: ندارد
        // ============================================
        function approveRequest(requestId) {
            if (!confirm('آیا از تایید این درخواست مطمئن هستید؟')) return;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        alert('درخواست تایید شد.\nنام سیستم: ' + response.data.system_name + '\nرمز رییس: ' + response.data.boss_username);
                        loadRequests();
                    } else {
                        alert('خطا در تایید درخواست');
                    }
                }
            };
            xhr.send('action=approve_request&request_id=' + requestId);
        }

        // ============================================
        // تابع: rejectRequest
        // وظیفه: رد درخواست
        // ورودی: requestId
        // خروجی: ندارد
        // ============================================
        function rejectRequest(requestId) {
            if (!confirm('آیا از رد این درخواست مطمئن هستید؟')) return;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        alert('درخواست رد شد');
                        loadRequests();
                    } else {
                        alert('خطا در رد درخواست');
                    }
                }
            };
            xhr.send('action=reject_request&request_id=' + requestId);
        }

        // ============================================
        // تابع: loadSystems
        // وظیفه: بارگذاری لیست سیستم‌ها
        // ورودی: ندارد
        // خروجی: ندارد
        // ============================================
        function loadSystems() {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        displaySystems(response.data);
                    }
                }
            };
            xhr.send('action=get_bosses');
        }

        // ============================================
        // تابع: displaySystems
        // وظیفه: نمایش لیست سیستم‌ها با قابلیت ویرایش
        // ورودی: systems (لیست سیستم‌ها)
        // خروجی: ندارد
        // ============================================
        function displaySystems(systems) {
            var container = document.getElementById('systemsList');
            if (!systems || systems.length === 0) {
                container.innerHTML = '<p class="info">هیچ سیستمی ثبت نشده است.</p>';
                return;
            }

            var html = '<table class="table">';
            html += '<thead><tr><th>#</th><th>نام سیستم</th><th>رمز رییس</th><th>تماس</th><th>عملیات</th></tr></thead>';
            html += '<tbody>';
            systems.forEach(function(sys) {
                html += '<tr>';
                html += '<td>' + sys.id + '</td>';
                html += '<td>' + sys.system_name + '</td>';
                html += '<td><input type="text" id="bossPass_' + sys.id + '" value="' + sys.boss_username + '" class="form-control form-control-sm"></td>';
                html += '<td>' + (sys.contact || '-') + '</td>';
                html += '<td><button onclick="updateBoss(' + sys.id + ')" class="btn btn-primary btn-sm">به‌روزرسانی</button></td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================
        // تابع: updateBoss
        // وظیفه: به‌روزرسانی رمز رییس
        // ورودی: bossId
        // خروجی: ندارد
        // ============================================
        function updateBoss(bossId) {
            var newPass = document.getElementById('bossPass_' + bossId).value;
            if (!newPass || newPass.length < 8) {
                alert('رمز باید حداقل 8 کاراکتر باشد');
                return;
            }

            if (!confirm('آیا از تغییر رمز مطمئن هستید؟')) return;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        alert('رمز با موفقیت به‌روزرسانی شد');
                        loadSystems();
                    } else {
                        alert('خطا در به‌روزرسانی رمز');
                    }
                }
            };
            xhr.send('action=update_boss&boss_id=' + bossId + '&new_username=' + encodeURIComponent(newPass));
        }

        // ============================================
        // تابع: logout
        // وظیفه: خروج از سیستم
        // ورودی: ندارد
        // خروجی: ندارد
        // ============================================
        function logout() {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'whiteboard.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    location.reload();
                }
            };
            xhr.send('action=logout');
        }

        // ============================================
        // رویدادهای دکمه‌ها
        // ============================================
        document.getElementById('loginBtn').addEventListener('click', checkManagerLogin);
        document.getElementById('managerPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkManagerLogin();
        });

        document.getElementById('showRequestsBtn').addEventListener('click', function() {
            document.getElementById('requestsSection').style.display = 'block';
            document.getElementById('systemsSection').style.display = 'none';
            loadRequests();
        });

        document.getElementById('showSystemsBtn').addEventListener('click', function() {
            document.getElementById('requestsSection').style.display = 'none';
            document.getElementById('systemsSection').style.display = 'block';
            loadSystems();
        });

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // بررسی وضعیت لاگین (با session)
        // اگر قبلاً لاگین کرده باشد، پنل نمایش داده شود
        // (در این نسخه ساده، همیشه صفحه ورود نمایش داده می‌شود)
    </script>
</body>
</html>
