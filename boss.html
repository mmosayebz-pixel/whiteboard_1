<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل رییس - گزارش‌نویسی گروهی</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
        }
        .modal-content {
            background: #fff; border-radius: 10px; padding: 25px;
            max-width: 90%; max-height: 80vh; overflow: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .table-responsive { overflow-x: auto; }
        .whiteboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
        .whiteboard-item { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; }
        .whiteboard-item:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .form-control-sm { padding: 5px 10px; font-size: 12px; }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px; }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-secondary { background: #95a5a6; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .button-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; }
        .error { color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #e74c3c; }
        .success { color: #27ae60; background: #e8f8f0; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #27ae60; }
        .info { color: #2980b9; background: #e8f4f8; padding: 10px; border-radius: 5px; margin: 10px 0; border-right: 3px solid #2980b9; }
        .hidden { display: none; }
        @media (max-width: 768px) {
            .btn { width: 100%; }
            .button-group { flex-direction: column; }
            .whiteboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ============================================ -->
        <!-- بخش: انتخاب ورود یا ثبت درخواست -->
        <!-- ============================================ -->
        <div id="loginSection">
            <h2>ورود به سیستم</h2>
            <div class="button-group">
                <button id="requestNewBtn" class="btn btn-primary">درخواست ایجاد سیستم جدید</button>
                <button id="loginToSystemBtn" class="btn btn-success">ورود به سیستم موجود</button>
            </div>

            <!-- ============================================ -->
            <!-- بخش: فرم درخواست جدید -->
            <!-- ============================================ -->
            <div id="requestForm" class="hidden">
                <h3>درخواست ایجاد سیستم جدید</h3>
                <div class="form-group">
                    <label for="newSystemName">نام سیستم (موسسه):</label>
                    <input type="text" id="newSystemName" class="form-control" placeholder="نام سیستم خود را وارد کنید">
                </div>
                <div class="form-group">
                    <label for="newContact">شماره تماس:</label>
                    <input type="text" id="newContact" class="form-control" placeholder="شماره تماس خود را وارد کنید">
                </div>
                <button id="submitRequestBtn" class="btn btn-primary">ثبت درخواست</button>
                <button id="backToLoginBtn" class="btn btn-secondary">بازگشت</button>
                <div id="requestResult" style="margin-top: 10px;"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: فرم ورود به سیستم -->
            <!-- ============================================ -->
            <div id="loginForm" class="hidden">
                <h3>ورود به سیستم</h3>
                <div id="welcomeMessageBoss" style="display:none;background:#e8f4f8;padding:10px;border-radius:5px;margin-bottom:15px;border-right:3px solid #2980b9;">
                    <p style="margin:0;color:#2980b9;">👋 خوش آمدید! لطفاً رمز خود را وارد کنید.</p>
                </div>
                <div class="form-group">
                    <label for="systemName">نام سیستم:</label>
                    <input type="text" id="systemName" class="form-control" placeholder="نام سیستم را وارد کنید">
                </div>
                <div class="form-group">
                    <label for="bossPassword">رمز 16 کاراکتری:</label>
                    <input type="password" id="bossPassword" class="form-control" placeholder="رمز 16 کاراکتری را وارد کنید">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="rememberMeBoss" checked>
                    <label for="rememberMeBoss" style="margin:0;font-weight:normal;">مرا به خاطر بسپار</label>
                </div>
                <button id="loginBtn" class="btn btn-success">ورود</button>
                <button id="backToLoginBtn2" class="btn btn-secondary">بازگشت</button>
                <div id="loginError" class="error hidden">نام سیستم یا رمز اشتباه است</div>
                <div id="loginMessage" style="margin-top:10px;"></div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- بخش: پنل رییس (پس از ورود) -->
        <!-- ============================================ -->
        <div id="bossPanel" class="hidden">
            <h2>پنل مدیریت سیستم: <span id="systemNameDisplay"></span></h2>
            <div class="button-group">
                <button id="createWhiteboardBtn" class="btn btn-primary">ایجاد وایتبرد جدید</button>
                <button id="manageUsersBtn" class="btn btn-primary">مدیریت کاربران</button>
                <button id="manageWhiteboardsBtn" class="btn btn-primary">مدیریت وایتبردها</button>
                <button id="reportsBtn" class="btn btn-primary">گزارش‌گیری</button>
                <button id="manageConnectionsBtn" class="btn btn-primary">مدیریت اتصال</button>
                <button id="bossLogoutBtn" class="btn btn-danger">خروج</button>
            </div>

            <!-- ============================================ -->
            <!-- بخش: ایجاد وایتبرد جدید -->
            <!-- ============================================ -->
            <div id="createWhiteboardSection" class="hidden">
                <h3>ایجاد وایتبرد جدید</h3>
                <div class="form-group">
                    <label for="newWhiteboardName">نام وایتبرد:</label>
                    <input type="text" id="newWhiteboardName" class="form-control">
                </div>
                <button id="createWhiteboardSubmit" class="btn btn-success">ایجاد</button>
                <button id="createWhiteboardCancel" class="btn btn-secondary">انصراف</button>
                <div id="createWhiteboardResult"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: مدیریت کاربران (ماتریس دسترسی) -->
            <!-- ============================================ -->
            <div id="manageUsersSection" class="hidden">
                <h3>مدیریت کاربران و سطوح دسترسی</h3>
                <div id="accessMatrix"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: مدیریت وایتبردها -->
            <!-- ============================================ -->
            <div id="manageWhiteboardsSection" class="hidden">
                <h3>مدیریت وایتبردها</h3>
                <div id="whiteboardsList"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: گزارش‌گیری -->
            <!-- ============================================ -->
            <div id="reportsSection" class="hidden">
                <h3>گزارش‌گیری</h3>
                <div class="button-group">
                    <button id="reportByUserBtn" class="btn btn-primary">گزارش از کاربران</button>
                    <button id="reportByDateBtn" class="btn btn-primary">گزارش زمانی</button>
                </div>
                <div id="reportResult"></div>
            </div>

            <!-- ============================================ -->
            <!-- بخش: مدیریت اتصال -->
            <!-- ============================================ -->
            <div id="manageConnectionsSection" class="hidden">
                <h3>مدیریت اتصال کاربران</h3>
                <div id="connectionsList"></div>
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // متغیرهای全局
    // ============================================
    var currentSystemName = '';
    var currentBossUsername = '';
    var currentAccessMatrix = [];

    // ============================================
    // تابع: loadSavedBossInfo
    // ============================================
    function loadSavedBossInfo() {
        var savedSystem = localStorage.getItem('boss_system_name');
        if (savedSystem) {
            document.getElementById('systemName').value = savedSystem;
            document.getElementById('welcomeMessageBoss').style.display = 'block';
            document.getElementById('bossPassword').focus();
        }
    }

    // ============================================
    // تابع: showRequestForm
    // ============================================
    function showRequestForm() {
        document.getElementById('requestForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('requestResult').innerHTML = '';
    }

    // ============================================
    // تابع: showLoginForm
    // ============================================
    function showLoginForm() {
        document.getElementById('requestForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('loginError').classList.add('hidden');
        loadSavedBossInfo();
    }

    // ============================================
    // تابع: submitNewRequest
    // ============================================
    function submitNewRequest() {
        var systemName = document.getElementById('newSystemName').value.trim();
        var contact = document.getElementById('newContact').value.trim();
        var resultDiv = document.getElementById('requestResult');

        if (!systemName || !contact) {
            resultDiv.innerHTML = '<div class="error">لطفاً همه فیلدها را پر کنید</div>';
            return;
        }

        resultDiv.innerHTML = '<div style="color:blue;">⏳ در حال ثبت درخواست...</div>';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        resultDiv.innerHTML = '<div class="success">✅ درخواست شما با موفقیت ثبت شد. پس از تایید مدیر، اطلاعات ورود برای شما ارسال خواهد شد.</div>';
                        document.getElementById('newSystemName').value = '';
                        document.getElementById('newContact').value = '';
                    } else {
                        resultDiv.innerHTML = '<div class="error">❌ خطا: ' + (response.error || 'نامشخص') + '</div>';
                    }
                } catch(e) {
                    resultDiv.innerHTML = '<div class="error">❌ خطا در پردازش پاسخ</div>';
                }
            }
        };
        xhr.send('action=add_request&system_name=' + encodeURIComponent(systemName) + '&contact=' + encodeURIComponent(contact));
    }

    // ============================================
    // تابع: bossLogin
    // ============================================
    function bossLogin() {
        var systemName = document.getElementById('systemName').value.trim();
        var password = document.getElementById('bossPassword').value.trim();
        var rememberMe = document.getElementById('rememberMeBoss').checked;
        var errorDiv = document.getElementById('loginError');
        var messageDiv = document.getElementById('loginMessage');

        if (!systemName || !password) {
            errorDiv.classList.remove('hidden');
            errorDiv.textContent = 'لطفاً همه فیلدها را پر کنید';
            return;
        }

        errorDiv.classList.add('hidden');
        if (messageDiv) messageDiv.innerHTML = '⏳ در حال بررسی...';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (messageDiv) messageDiv.innerHTML = '';
                if (xhr.status === 200) {
                    try {
                        var response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            if (rememberMe) {
                                localStorage.setItem('boss_system_name', systemName);
                            } else {
                                localStorage.removeItem('boss_system_name');
                            }
                            currentSystemName = systemName;
                            currentBossUsername = response.data.boss_username;
                            document.getElementById('systemNameDisplay').textContent = systemName;
                            document.getElementById('loginSection').style.display = 'none';
                            document.getElementById('bossPanel').classList.remove('hidden');
                            errorDiv.classList.add('hidden');
                            loadAccessMatrix();
                        } else {
                            errorDiv.classList.remove('hidden');
                            errorDiv.textContent = 'نام سیستم یا رمز اشتباه است';
                            document.getElementById('bossPassword').value = '';
                            document.getElementById('bossPassword').focus();
                        }
                    } catch(e) {
                        errorDiv.classList.remove('hidden');
                        errorDiv.textContent = '❌ خطا در پردازش پاسخ سرور';
                    }
                } else {
                    errorDiv.classList.remove('hidden');
                    errorDiv.textContent = '❌ خطا در ارتباط با سرور (کد: ' + xhr.status + ')';
                }
            }
        };
        xhr.send('action=verify_boss&system_name=' + encodeURIComponent(systemName) + '&password=' + encodeURIComponent(password));
    }

    // ============================================
    // تابع: loadAccessMatrix
    // ============================================
    function loadAccessMatrix() {
        if (!currentSystemName) {
            document.getElementById('accessMatrix').innerHTML = '<div class="error">❌ خطا: نام سیستم وارد نشده</div>';
            return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        currentAccessMatrix = response.data;
                        displayAccessMatrix();
                    } else {
                        document.getElementById('accessMatrix').innerHTML = '<div class="error">❌ خطا: ' + (response.error || 'نامشخص') + '</div>';
                    }
                } catch(e) {
                    document.getElementById('accessMatrix').innerHTML = '<div class="error">❌ خطا در پردازش پاسخ</div>';
                }
            }
        };
        xhr.send('action=get_access_matrix&system_name=' + encodeURIComponent(currentSystemName));
    }

    // ============================================
    // تابع: displayAccessMatrix
    // ============================================
    function displayAccessMatrix() {
        var container = document.getElementById('accessMatrix');
        var data = currentAccessMatrix;
        
        var html = '<div style="background:#f8f9fa;padding:15px;border-radius:5px;margin-bottom:15px;border:1px solid #ddd;">';
        html += '<h4>➕ اضافه کردن کاربر جدید</h4>';
        html += '<div class="form-group" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">';
        html += '<input type="text" id="newUserAgentName" class="form-control" placeholder="نام کاربر جدید" style="flex:1;min-width:150px;">';
        html += '<button onclick="addNewUserByBoss()" class="btn btn-success">➕ اضافه کردن کاربر</button>';
        html += '</div>';
        html += '<div id="addUserResult" style="margin-top:10px;"></div>';
        html += '</div>';
        
        if (!data.whiteboards || data.whiteboards.length === 0) {
            html += '<p class="info">هنوز وایتبردی ایجاد نشده است. ابتدا یک وایتبرد جدید ایجاد کنید.</p>';
            container.innerHTML = html;
            return;
        }

        if (!data.users || data.users.length === 0) {
            html += '<p class="info">هنوز کاربری ثبت نشده است.</p>';
            container.innerHTML = html;
            return;
        }

        html += '<div class="table-responsive"><table class="table table-bordered">';
        html += '<thead><tr><th>کاربر</th><th>رمز</th>';
        data.whiteboards.forEach(function(wb) {
            html += '<th>' + wb + '</th>';
        });
        html += '<th>عملیات</th></tr></thead><tbody>';

        data.users.forEach(function(user) {
            html += '<tr><td>' + user.agent + '</td><td>' + user.password + '</td>';
            data.whiteboards.forEach(function(wb) {
                var level = user[wb] || 0;
                html += '<td><select onchange="updateAccessLevel(\'' + user.agent + '\', \'' + wb + '\', this.value)" class="form-control form-control-sm">';
                html += '<option value="0" ' + (level === 0 ? 'selected' : '') + '>۰ - بدون دسترسی</option>';
                html += '<option value="1" ' + (level === 1 ? 'selected' : '') + '>۱ - فقط دیدن</option>';
                html += '<option value="2" ' + (level === 2 ? 'selected' : '') + '>۲ - خواندن و نوشتن</option>';
                html += '<option value="3" ' + (level === 3 ? 'selected' : '') + '>۳ - کامل (حذف)</option>';
                html += '</select></td>';
            });
            html += '<td><button onclick="deleteUser(\'' + user.agent + '\')" class="btn btn-danger btn-sm">حذف کاربر</button></td></tr>';
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    // ============================================
    // تابع: updateAccessLevel
    // ============================================
    function updateAccessLevel(agentName, whiteboardName, level) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                var response = JSON.parse(xhr.responseText);
                if (!response.success) {
                    alert('خطا در به‌روزرسانی سطح دسترسی');
                    loadAccessMatrix();
                }
            }
        };
        xhr.send('action=update_access&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&agent_name=' + encodeURIComponent(agentName) + 
                 '&whiteboard_name=' + encodeURIComponent(whiteboardName) + 
                 '&level=' + level);
    }

    // ============================================
    // تابع: deleteUser
    // ============================================
    function deleteUser(agentName) {
        if (!confirm('آیا از حذف کاربر "' + agentName + '" مطمئن هستید؟')) return;
        if (!confirm('تأیید نهایی: کاربر "' + agentName + '" برای همیشه حذف خواهد شد.')) return;

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('کاربر با موفقیت حذف شد');
                    loadAccessMatrix();
                } else {
                    alert('خطا در حذف کاربر');
                }
            }
        };
        xhr.send('action=delete_user&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&agent_name=' + encodeURIComponent(agentName));
    }

    // ============================================
    // تابع: addNewUserByBoss
    // ============================================
    function addNewUserByBoss() {
        var agentName = document.getElementById('newUserAgentName').value.trim();
        var resultDiv = document.getElementById('addUserResult');
        if (!agentName) {
            resultDiv.innerHTML = '<div class="error">❌ لطفاً نام کاربر را وارد کنید</div>';
            return;
        }
        if (!confirm('آیا از اضافه کردن کاربر "' + agentName + '" مطمئن هستید؟')) return;

        resultDiv.innerHTML = '<div style="color:blue;">⏳ در حال اضافه کردن کاربر...</div>';
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        resultDiv.innerHTML = '<div class="success">✅ ' + response.message + '</div>';
                        if (response.password) {
                            resultDiv.innerHTML += '<div class="success" style="margin-top:5px;">🔑 رمز کاربر: <strong>' + response.password + '</strong></div>';
                        }
                        document.getElementById('newUserAgentName').value = '';
                        setTimeout(function() { loadAccessMatrix(); }, 1000);
                    } else {
                        resultDiv.innerHTML = '<div class="error">❌ خطا: ' + (response.error || 'نامشخص') + '</div>';
                    }
                } catch(e) {
                    resultDiv.innerHTML = '<div class="error">❌ خطا در پردازش پاسخ</div>';
                }
            }
        };
        xhr.send('action=add_user_by_boss&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&agent_name=' + encodeURIComponent(agentName));
    }

    // ============================================
    // تابع: loadWhiteboards
    // ============================================
    function loadWhiteboards() {
        if (!currentSystemName) {
            document.getElementById('whiteboardsList').innerHTML = '<div class="error">❌ خطا: نام سیستم وارد نشده</div>';
            return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        displayWhiteboards(response.data);
                    } else {
                        document.getElementById('whiteboardsList').innerHTML = '<div class="error">❌ خطا: ' + (response.error || 'نامشخص') + '</div>';
                    }
                } catch(e) {
                    document.getElementById('whiteboardsList').innerHTML = '<div class="error">❌ خطا در پردازش پاسخ</div>';
                }
            }
        };
        xhr.send('action=get_whiteboards&system_name=' + encodeURIComponent(currentSystemName));
    }

    // ============================================
    // تابع: displayWhiteboards
    // ============================================
    function displayWhiteboards(whiteboards) {
        var container = document.getElementById('whiteboardsList');
        if (!whiteboards || whiteboards.length === 0) {
            container.innerHTML = '<p class="info">هیچ وایتبردی وجود ندارد.</p>';
            return;
        }

        var html = '<table class="table"><thead><tr><th>#</th><th>نام وایتبرد</th><th>عملیات</th></tr></thead><tbody>';
        whiteboards.forEach(function(wb, index) {
            html += '<tr><td>' + (index + 1) + '</td>';
            html += '<td><input type="text" id="rename_wb_' + index + '" value="' + wb + '" class="form-control form-control-sm"></td>';
            html += '<td>';

    // ============================================
    // تابع: renameWhiteboard
    // ============================================
    function renameWhiteboard(index, oldName) {
        var newName = document.getElementById('rename_wb_' + index).value.trim();
        if (!newName || newName === oldName) {
            alert('نام جدید را وارد کنید یا از نام قبلی استفاده نکنید');
            return;
        }
        if (!confirm('آیا از تغییر نام "' + oldName + '" به "' + newName + '" مطمئن هستید؟')) return;

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('نام با موفقیت تغییر کرد');
                    loadWhiteboards();
                    loadAccessMatrix();
                } else {
                    alert('خطا در تغییر نام: ' + (response.error || 'نامشخص'));
                }
            }
        };
        xhr.send('action=rename_whiteboard&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&old_name=' + encodeURIComponent(oldName) + 
                 '&new_name=' + encodeURIComponent(newName));
    }

    // ============================================
    // تابع: createNewWhiteboard
    // ============================================
    function createNewWhiteboard() {
        var name = document.getElementById('newWhiteboardName').value.trim();
        if (!name) {
            document.getElementById('createWhiteboardResult').innerHTML = '<div class="error">لطفاً نام وایتبرد را وارد کنید</div>';
            return;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    alert('✅ وایتبرد "' + name + '" با موفقیت ایجاد شد!');
                    document.getElementById('createWhiteboardResult').innerHTML = '<div class="success">وایتبرد با موفقیت ایجاد شد</div>';
                    document.getElementById('newWhiteboardName').value = '';

                    loadWhiteboards();

        xhr.send('action=create_whiteboard&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&whiteboard_name=' + encodeURIComponent(name) + 
                 '&agent=' + encodeURIComponent('boss'));

    // ============================================
    // تابع: viewUserLog
    // ============================================
    function viewUserLog(agentName) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

    // ============================================
    function displayUserLog(agentName, logData) {

        logData.forEach(function(item) {
            html += '<tr><td>' + item.date + '</td><td>' + item.whiteboard_name + '</td><td>' + item.message + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '<button onclick="this.closest(\'.modal-overlay\').style.display=\'none\'" class="btn btn-secondary">بستن</button>';
        html += '</div></div>';

    // ============================================
    // تابع: showReportByDate
    // ============================================
    function showReportByDate() {
        var html = '<h4>گزارش زمانی</h4>';
        html += '<div class="form-group"><label>از تاریخ:</label><input type="datetime-local" id="startDate" class="form-control"></div>';
        html += '<div class="form-group"><label>تا تاریخ:</label><input type="datetime-local" id="endDate" class="form-control"></div>';
        html += '<button onclick="getReportByDate()" class="btn btn-primary">نمایش گزارش</button>';

    // ============================================
    // تابع: getReportByDate
    // ============================================
    function getReportByDate() {
        var startDate = document.getElementById('startDate').value;
        var endDate = document.getElementById('endDate').value;
        if (!startDate || !endDate) {
            alert('لطفاً هر دو تاریخ را وارد کنید');
            return;
        }

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    displayDateReport(response.data);
                }
            }
        };
        xhr.send('action=get_messages_by_date&system_name=' + encodeURIComponent(currentSystemName) + 
                 '&start_date=' + encodeURIComponent(startDate) + 
                 '&end_date=' + encodeURIComponent(endDate));
    }

    // ============================================
    // تابع: displayDateReport
    // ============================================
    function displayDateReport(data) {
        if (!data || data.length === 0) {
            document.getElementById('dateReportResult').innerHTML = '<p class="info">هیچ گزارشی در بازه زمانی انتخاب شده یافت نشد</p>';
            return;
        }

        var html = '<div class="modal-overlay" onclick="this.style.display=\'none\'">';
        html += '<div class="modal-content" onclick="event.stopPropagation()" style="max-height:80vh;overflow:auto;">';
        html += '<h4>گزارش زمانی</h4>';
        html += '<table class="table table-bordered table-sm" id="dateReportTable">';
        html += '<thead><tr><th onclick="sortTable(0)">تاریخ ↕</th><th onclick="sortTable(1)">کاربر ↕</th><th onclick="sortTable(2)">وایتبرد ↕</th><th>متن</th></tr></thead><tbody>';
        data.forEach(function(item) {
            html += '<tr><td>' + item.date + '</td><td>' + item.agent + '</td><td>' + item.whiteboard + '</td><td>' + item.message + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '<button onclick="this.closest(\'.modal-overlay\').style.display=\'none\'" class="btn btn-secondary">بستن</button>';
        html += '</div></div>';
        document.getElementById('dateReportResult').innerHTML = html;
    }

    // ============================================
    // تابع: sortTable
    // ============================================
    function sortTable(colIndex) {
        var table = document.getElementById('dateReportTable');
        var tbody = table.tBodies[0];
        var rows = Array.from(tbody.rows);
        var isAsc = table.getAttribute('data-sort-asc') === 'true';
        rows.sort(function(a, b) {
            var aVal = a.cells[colIndex].textContent.trim();
            var bVal = b.cells[colIndex].textContent.trim();
            return isAsc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        });
        table.setAttribute('data-sort-asc', !isAsc);
        rows.forEach(function(row) { tbody.appendChild(row); });
    }

    function loadConnections() {

            html += '<td><button onclick="deleteUser(\'' + user.agent + '\')" class="btn btn-danger btn-sm">حذف کاربر</button></td></tr>';
        });
        html += '</tbody></table>';
        html += '<h4>اضافه کردن کاربر جدید</h4>';
        html += '<div class="form-group"><input type="text" id="newAgentName" class="form-control" placeholder="نام کاربر جدید"></div>';
        html += '<button onclick="addNewAgent()" class="btn btn-success">اضافه کردن کاربر</button>';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'whiteboard.php', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

            if (xhr.readyState === 4 && xhr.status === 200) {

                 '&agent_name=' + encodeURIComponent(agentName));
